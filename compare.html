<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Report - NeuroMotion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Doto:wght@700&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 50px;min-width:0}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .head .acts{display:flex;gap:10px;flex-wrap:wrap}
  h1{font-size:32px;margin:6px 0 2px} .sub{color:var(--mute);font-size:14px}
  .card{padding:20px 24px;margin-top:16px}
  .note{font-size:13px;color:var(--mute);margin:4px 0 8px;line-height:1.5}
  /* row 1: evidence, full width */
  .evi{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;align-items:center}
  .big{font-size:60px;line-height:1} .big small{font:400 15px/1.3 var(--f-body);color:var(--mute);display:block;margin-top:8px;max-width:270px}
  .stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 10px}
  .stack i{display:block;height:100%} .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute)} .legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  @media(max-width:800px){.evi{grid-template-columns:1fr;gap:14px}}
  /* row 2: upload + tall rule-out card */
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;gap:16px;align-items:stretch;margin-top:16px}
  .row2.no-mri{grid-template-columns:minmax(0,1fr) 300px}
  @media(max-width:1100px){.row2,.row2.no-mri{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .row2 .rule{grid-column:1/-1}}
  @media(max-width:700px){.row2,.row2.no-mri{grid-template-columns:1fr}}
  .row2 .card{margin-top:0}
  /* MRI card stack: click the pile to enlarge with its caption; arrows move to the next image */
  #mri{display:flex;flex-direction:column;min-width:0} #mri h3{font-size:16px}
  .mpile{position:relative;flex:1;min-height:250px;margin:6px 0 4px;cursor:zoom-in;outline:none;border-radius:16px}
  .mpile:focus-visible{box-shadow:0 0 0 3px var(--sage-d)}
  .mc{position:absolute;left:0;bottom:0;width:calc(100% - 28px);height:calc(100% - 28px);border-radius:16px;overflow:hidden;background:#0c0f0d;border:1px solid rgba(255,255,255,.5);box-shadow:0 6px 18px rgba(30,45,30,.25);transform-origin:bottom left;transition:transform .5s cubic-bezier(.4,.2,.2,1),opacity .35s ease}
  .mc img{width:100%;height:100%;object-fit:contain;display:block;background:#0c0f0d}
  .mc .mtag{position:absolute;left:10px;top:10px;padding:2px 10px;border-radius:99px;font:500 11px var(--f-body);background:rgba(255,255,255,.88);color:#16191a}
  .mc[data-r="0"]{transform:none;z-index:9} .mc[data-r="1"]{transform:translate(14px,-14px);z-index:8} .mc[data-r="2"]{transform:translate(28px,-28px);z-index:7}
  .mc:not([data-r="0"]):not([data-r="1"]):not([data-r="2"]){transform:translate(28px,-28px);z-index:1;opacity:0}
  .mc:not([data-r="0"]) .mtag{opacity:0}
  .mpile:hover .mc[data-r="1"]{transform:translate(17px,-17px)} .mpile:hover .mc[data-r="2"]{transform:translate(34px,-34px)}
  .mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-top:6px;min-height:30px}
  .mnav .mt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mnav button,.lb button{font:500 15px var(--f-body);width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);cursor:pointer;padding:0;flex-shrink:0}
  .mnav button:hover,.lb button:hover{background:#fff}
  @media (prefers-reduced-motion:reduce){.mc{transition:none}}
  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,11,.82);backdrop-filter:blur(6px)}
  .lb figure{margin:0;max-width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;background:var(--card-solid,#f4f6f3);border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:auto}
  .lb img{max-width:100%;max-height:62vh;object-fit:contain;background:#0c0f0d;border-radius:14px;align-self:center}
  .lb figcaption{font-size:14px;line-height:1.5} .lb figcaption b{font-family:var(--f-head)} .lb .lbt{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
  .lb .lbc{display:flex;align-items:center;justify-content:space-between;gap:10px} .lb .lbc span{font-size:12px;color:var(--mute)}
  .lb .lbx{width:auto;border-radius:99px;padding:0 14px;font-size:13px}
    .brief{font-size:15px;line-height:1.5;margin:12px 0 0} .brief .gl{width:20px;height:20px;vertical-align:-4px;margin-right:8px} @media(prefers-color-scheme:dark){:root:not([data-theme=light]) .brief .gl{}}
  #up{display:flex;flex-direction:column} #up .drop{flex:1;min-height:130px}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px 16px;border:2px dashed var(--line);border-radius:22px;cursor:pointer;background:rgba(255,255,255,.35);transition:.15s}
  .drop:hover,.drop.over{border-color:var(--sage-d);background:rgba(255,255,255,.6)}
  .drop .ic{width:42px;height:42px;border-radius:14px;background:var(--card-solid,#f4f6f3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .drop b{font:600 16px var(--f-head)} .drop span{font-size:13px;color:var(--mute)}
  .rev{margin-top:16px;display:none} .rev.on{display:block}
  .rev table{width:100%;border-collapse:collapse;font-size:14px} .rev td{padding:8px 4px;border-bottom:1px solid var(--line)} .rev input{width:92px;font:inherit;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  .rev .x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
  .st{font-size:13px;color:var(--mute);margin-top:8px;min-height:1.3em} .st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
  /* markers: flip tiles (click to turn over) */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));grid-auto-rows:auto;gap:14px;margin-top:12px}
  .tile{perspective:1000px;cursor:pointer;border-radius:16px;outline:none;transition:transform .2s ease,filter .2s ease}
  .tile:hover{transform:translateY(-3px)} .tile:focus-visible{box-shadow:0 0 0 3px var(--sage-d)}
  .ti{position:relative;display:grid;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .tile.flip .ti{transform:rotateY(180deg)}
  .face{grid-area:1/1;position:relative;min-width:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.58);border:1px solid var(--glass-line);border-left:4px solid var(--line);overflow:hidden;box-shadow:0 4px 14px rgba(60,80,60,.08)}
  .face.bk{transform:rotateY(180deg);background:var(--card-solid,#f4f6f3);overflow:hidden;padding:12px 14px 10px}
  .tile.bad .face{border-left-color:var(--bad)} .tile.warn .face{border-left-color:#d9a23a} .tile.ok .face{border-left-color:var(--ok)} .tile.neutral .face{border-left-color:var(--mute)}
  .tile.nodata .face.ft{opacity:.62;border-style:dashed;border-left-style:dashed}
  .t-cat{font:500 9px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
  .t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px} .t-name{font:500 13px/1.3 var(--f-body)}
  .pl{flex-shrink:0;padding:2px 10px;border-radius:99px;font:500 11px var(--f-body);background:rgba(255,255,255,.9);color:#16191a;border:1px solid var(--line)} .pl.dark{background:var(--pill);color:var(--page);border-color:var(--pill)}
  .t-val{font:500 22px var(--f-head);margin-top:8px;white-space:nowrap} .t-val small{font:400 11px var(--f-body);color:var(--mute);margin-left:4px} .t-rl{font:400 9.5px var(--f-mono);letter-spacing:.05em;color:var(--mute)}
  .t-txt{font-size:13px;margin-top:10px;color:var(--ink);line-height:1.35} .t-hint{position:absolute;right:12px;bottom:8px;font:400 9.5px var(--f-mono);letter-spacing:.05em;color:var(--mute);opacity:.8}
  .face.bk{padding:10px 12px 8px}
  .bk-h{font:600 12.5px/1.25 var(--f-head);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-why{font-size:11px;line-height:1.35;color:var(--mute);margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bk-r{font-size:11px;line-height:1.45;display:flex;gap:6px;align-items:center;min-width:0} .bk-r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} .bk-r i{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0} .bk-r i.c{background:rgba(111,174,124,.95)} .bk-r i.a{background:rgba(208,87,75,.9)}
  .bk-c{font-size:11px;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .bk-f{font-size:10px;color:var(--warn);margin-top:2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* card pile for markers without a result yet: sits in the grid like a tile, back cards peek out top-right */
  .deck-cell{min-width:0;min-height:150px}
  .deck{position:relative;width:100%;height:100%;cursor:pointer;outline:none;border-radius:16px}
  .deck:focus-visible{box-shadow:0 0 0 3px var(--sage-d)}
  .dk{position:absolute;left:0;bottom:0;width:calc(100% - 24px);height:calc(100% - 24px);background:var(--bg);color:#16191a;border-radius:16px;padding:11px 14px;overflow:hidden;box-shadow:0 5px 16px rgba(40,60,40,.16);transform-origin:bottom left;transition:transform .55s cubic-bezier(.4,.2,.2,1),opacity .4s ease}
  .dk>*{transition:opacity .25s ease}
  .dk[data-r="0"]{transform:none;z-index:9;opacity:1}
  .dk[data-r="1"]{transform:translate(12px,-12px);z-index:8;opacity:1}
  .dk[data-r="2"]{transform:translate(24px,-24px);z-index:7;opacity:1}
  .dk:not([data-r="0"]):not([data-r="1"]):not([data-r="2"]){transform:translate(24px,-24px);z-index:1;opacity:0}
  .dk:not([data-r="0"])>*{opacity:0}
  .deck:hover .dk[data-r="1"]{transform:translate(15px,-15px)} .deck:hover .dk[data-r="2"]{transform:translate(30px,-30px)}
  .dk .t-cat{color:rgba(22,25,26,.6)} .dk .pl{background:rgba(255,255,255,.75);border-color:transparent}
  .dk-b{margin-top:5px;font-size:11px;line-height:1.4} .dk-b .bk-why{margin:0 0 4px;color:rgba(22,25,26,.7);-webkit-line-clamp:1} .dk-b .bk-r{color:#16191a;font-size:10.5px;line-height:1.35}
  .dk-n{position:absolute;left:14px;bottom:8px;font:400 9.5px var(--f-mono);letter-spacing:.05em;color:rgba(22,25,26,.6)}
  @media (prefers-reduced-motion:reduce){.dk{transition:none}}
  /* compact first screen */
  .big{font-size:50px} .evi{padding:16px 24px} .evi .stack{height:14px}
  .rule h3{font-size:16px} .rule .note{margin:2px 0 4px}
  .rule .it{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45}
  .rule .it:last-of-type{border-bottom:0} .rule .it b{font-weight:500;font-size:13.5px;margin:0} .rule .it .tag{margin:0;padding:2px 10px;font-size:11px} .rule .it .say{grid-column:1/-1;margin-top:3px}
  #up .drop{min-height:96px;padding:12px}
  @media (prefers-reduced-motion:reduce){.ti,.tile{transition:none}}
  .rb{position:relative;height:22px;margin-top:6px} .rb .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
  .rb .bc,.rb .ba{position:absolute;top:6px;height:10px;border-radius:4px} .rb .bc{background:rgba(111,174,124,.55)} .rb .ba{background:rgba(208,87,75,.5)}
  .rb .pt{width:4px!important;border-radius:2px;top:4px!important;height:14px!important}
  .rb .al,.rb .al2{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;transform:translateX(-8px);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)} .rb .al{background:var(--pill)} .rb .al2{background:var(--card-solid,#f4f6f3);border-color:var(--pill);width:10px;height:10px;top:6px;transform:translateX(-5px);opacity:.8}
  .rb .cut{position:absolute;top:1px;bottom:1px;border-left:2px dashed var(--mute)}
  .key{display:flex;gap:18px;font-size:12px;color:var(--mute);margin-top:14px;flex-wrap:wrap} .key i{display:inline-block;width:16px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .tag{display:inline-block;padding:3px 11px;border-radius:99px;font:500 12px var(--f-body);white-space:nowrap}
  .tag.neutral,.tag.none{background:var(--sage-l);color:var(--mute)}
  .fine{font-size:12px;color:var(--mute);line-height:1.55;margin-top:18px}
  #apa{display:none}
  /* ============ print: formal APA-style document ============ */
  @page{size:Letter;margin:1in;@top-right{content:counter(page);font:12pt "Times New Roman",Times,serif}}
  @media print{
    html,body{background:#fff!important;color:#000}
    .shell>.side,.wrap>*:not(#apa),.lb{display:none!important}
    .shell{display:block;padding:0;max-width:none} .wrap{max-width:none;padding:0;margin:0}
    #apa{display:block;font:12pt/2 "Times New Roman",Times,serif;color:#000}
    #apa h1{font:700 12pt/2 "Times New Roman",Times,serif;text-align:center;margin:0}
    #apa h2{font:700 12pt/2 "Times New Roman",Times,serif;text-align:center;margin:0;break-after:avoid}
    #apa h3{font:700 12pt/2 "Times New Roman",Times,serif;text-align:left;margin:0;break-after:avoid}
    #apa p{margin:0;text-indent:.5in;text-align:left} #apa p.ni{text-indent:0}
    #apa .tb{text-align:center;margin-bottom:.4in}
    #apa .tb p{text-indent:0;text-align:center}
    #apa .abs p{text-indent:0}
    #apa .kw{text-indent:.5in}
    #apa .tbl{break-inside:avoid}
    #apa .tn{font-weight:700;margin-top:.15in;break-after:avoid;line-height:1.5} #apa .tt{font-style:italic;margin-bottom:.06in;break-after:avoid;line-height:1.5}
    #apa table{width:100%;border-collapse:collapse;font-size:10pt;line-height:1.35;border-top:1pt solid #000;border-bottom:1pt solid #000;break-inside:avoid}
    #apa th{font-weight:400;font-style:normal;text-align:left;padding:4pt 6pt;border-bottom:.75pt solid #000;vertical-align:bottom}
    #apa td{padding:3.5pt 6pt;vertical-align:top;border:0}
    #apa td.n,#apa th.n{text-align:right;white-space:nowrap}
    #apa .tnote{font-size:10pt;line-height:1.4;text-indent:0;margin-top:.05in;margin-bottom:.15in}
    #apa .tnote i{font-style:italic}
    #apa .refs p{padding-left:.5in;text-indent:-.5in}
    #apa .fig{break-inside:avoid;margin:.1in 0 .2in} #apa .fig img{display:block;margin:.05in auto;max-width:3.3in;max-height:3.4in;border:.5pt solid #000}
    #apa .fig .tt{margin-bottom:.04in}
    #apa .pb{break-before:page}
    #apa sup{font-size:8pt;line-height:0}
  }
</style>
</head>
<body>
<div class="shell"><aside class="side" id="navmount" data-active="report"></aside>
<div class="wrap">
  <div class="head"><div><h1>Doctor report</h1><div class="sub" id="who">Loading...</div></div>
    <div class="acts"><button class="btn ghost" id="copy-sum">Copy summary</button><button class="btn ghost" id="copy-tbl">Copy results table</button><button class="btn" id="gen">Generate report</button></div></div>
  <div class="st" id="copy-st" style="margin-top:4px"></div>

  <div class="glass card evi" id="evi"></div>

  <div class="row2">
    <div class="glass card" id="up">
      <h3 style="font-size:16px">Add results</h3>
      <p class="note" style="margin-top:2px">We read the values, you check them, and the report updates.</p>
      <label class="drop" id="drop" for="file"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9H17"/><path d="M12 12v8M9 15l3-3 3 3"/></svg></span><b>Upload a results file</b><span>or, click to browse (CSV, JSON, text, image or PDF &middot; 4 MB max)</span></label>
      <input type="file" id="file" hidden accept=".csv,.tsv,.json,.txt,.md,image/png,image/jpeg,image/webp,application/pdf">
      <p class="note" style="margin-top:8px;font-size:12px">CSV, JSON and text are read on this computer. Photos and PDFs are read by Gemini (Google): use synthetic or de-identified files only.</p>
      <div class="st" id="up-st"></div>
      <div class="rev" id="rev"><h4 style="font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:6px 0">Found in the file</h4><table id="rev-t"></table><div class="note" id="rev-skip"></div>
        <div style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end"><button class="btn ghost" id="rev-cancel">Cancel</button><button class="btn" id="rev-save">Update results</button></div></div>
    </div>
    <div class="glass card" id="mri" hidden></div>
    <div class="glass card rule" id="rule"></div>
  </div>

  <div class="glass card" id="home"></div>
  <div class="glass card" id="marks"></div>
  <p class="fine" id="fine"></p>

  <article id="apa" aria-label="Report document"></article>
</div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="MRI image viewer"></div>
<script src="nav.js"></script>
<script src="measures.js"></script>
<script src="dictation.js"></script>
<script src="labfile.js"></script>
<script src="companion-api.js"></script>
<script src="kgest.js"></script>
<script src="homepanel.js"></script>
<script src="reference.js"></script>
<script src="mri.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id), esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PATIENT=new URLSearchParams(location.search).get("patient")||"ALEX-CASE";
const META={"ALEX-CASE":{who:"a 47-year-old man",fict:true}};
// Fallback = the case-file column of the source table (used when the API is not running)
const STATIC={grip_kg_r:14,grip_kg_l:32,pinch_kg_r:3,pinch_kg_l:8,speech_wpm:142,nfl_pgml:88,ck:470,walk10m_s:14.2,snip_cmh2o:52,fvc_sit_pct:78,fvc_sup_pct:64};
let current=null;
async function getValues(){
  try{const r=await fetch("/api/summary?patient="+encodeURIComponent(PATIENT));if(!r.ok)throw 0;const s=await r.json();const v={};for(const[k,m]of Object.entries(s.metrics))v[k]=m.last;if(!Object.keys(v).length)throw 0;return{values:v,metrics:s.metrics,live:true}}
  catch(e){return{values:{...STATIC},metrics:null,live:false}}
}
const fmt=x=>x==null?"-":Math.abs(x)>=100?Math.round(x):+(+x).toFixed(Math.abs(x)<1?3:1);
const M=()=>Measures.METRICS, lab=k=>M()[k].label+(/_r$/.test(k)?" (right)":/_l$/.test(k)?" (left)":"");
const today=new Date(), dateLong=today.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
function bar(row){
  const [a0,a1]=row.axis,pos=v=>Math.max(0,Math.min(100,(v-a0)/(a1-a0)*100)),b=(x,cls)=>{ if(!x||(x.lo==null&&x.v==null))return"";
    if(x.v!=null)return`<div class="${cls} pt" style="left:calc(${pos(x.v)}% - 2px)"></div>`; const l=pos(x.lo),h=pos(x.hi);return`<div class="${cls}" style="left:${l}%;width:${Math.max(1,h-l)}%"></div>`};
  const vals=(row.shown||[]).filter(v=>v!=null),main=row.value;
  let m="";for(const v of vals){ if(v===main)continue; m+=`<div class="al2" style="left:${pos(v)}%" title="${fmt(v)}"></div>`}
  if(main!=null)m+=`<div class="al" style="left:${pos(main)}%" title="${fmt(main)}"></div>`;
  const cut=row.cutoff!=null?`<div class="cut" style="left:${pos(row.cutoff)}%" title="cut-off ${row.cutoff}"></div>`:"";

  const btn=$("gen"), E=Reference.evaluate(current.values), f=aiFindings(E), key=JSON.stringify(f), cs=$("copy-st");
  btn.disabled=true; btn.textContent="Gemini is writing the report..."; cs.textContent=""; cs.className="st";
  if(!reportOk(E)){
    try{const j=await askGemini(f,"report"); REPORT={key,sections:j.sections}}
    catch(e){cs.textContent="Gemini was not available ("+e.message+"), so the report uses the built-in text."; cs.className="st bad"}
    renderApa(current,Reference.evaluate(current.values));
  }
  btn.disabled=false; btn.textContent="Generate report";
  setTimeout(()=>window.print(),150);
}
$("gen").onclick=generateReport;
/* ---------------- MRI card stack + lightbox ---------------- */
const SCANS=MRI.forPatient(PATIENT); let mriCur=0, lbOpen=false, lbFrom=null;
function renderMri(){
  const box=$("mri"), row=document.querySelector(".row2");
  if(!SCANS.length){box.hidden=true; row.classList.add("no-mri"); return}
  if(box.dataset.built){layoutMri(); return}
  box.dataset.built="1"; box.hidden=false; row.classList.remove("no-mri");
  box.innerHTML=`<h3>MRI scans</h3><p class="note" style="margin-top:2px">Click the stack to enlarge an image with its caption.</p>
    <div class="mpile" id="mpile" tabindex="0" role="button" aria-label="MRI images, ${SCANS.length} in the stack. Click to enlarge.">${SCANS.map((m,i)=>`<div class="mc" data-i="${i}"><img src="${esc(m.src)}" alt="${esc(m.alt)}" draggable="false"><span class="mtag">${esc(m.tab)}</span></div>`).join("")}</div>
    <div class="mnav"><button type="button" id="m-prev" aria-label="Previous image">&#8249;</button><span class="mt" id="m-t"></span><button type="button" id="m-next" aria-label="Next image">&#8250;</button></div>`;
  layoutMri();
  $("mpile").addEventListener("click",()=>openLb(mriCur));
  $("mpile").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLb(mriCur)} else if(e.key==="ArrowRight")stepMri(1); else if(e.key==="ArrowLeft")stepMri(-1)});
  $("m-prev").onclick=()=>stepMri(-1); $("m-next").onclick=()=>stepMri(1);
}
function layoutMri(){const n=SCANS.length; document.querySelectorAll("#mpile .mc").forEach(el=>{el.dataset.r=(+el.dataset.i-mriCur+n)%n}); const t=$("m-t"); if(t)t.textContent=`${mriCur+1} / ${n} · ${SCANS[mriCur].title}`}
function stepMri(d){mriCur=(mriCur+d+SCANS.length)%SCANS.length; layoutMri()}
function drawLb(){
  const m=SCANS[mriCur];
  $("lb").innerHTML=`<figure><div class="lbc"><button type="button" id="lb-prev" aria-label="Previous image">&#8249;</button><span>${mriCur+1} of ${SCANS.length}</span><button type="button" id="lb-next" aria-label="Next image">&#8250;</button><button type="button" class="lbx" id="lb-x">Close</button></div>
    <img src="${esc(m.src)}" alt="${esc(m.alt)}"><figcaption><div class="lbt">Figure ${m.n} &middot; ${esc(m.tab)}</div><b>${esc(m.label)}. ${esc(m.title)}.</b> ${esc(m.finding)}</figcaption></figure>`;
  $("lb-prev").onclick=e=>{e.stopPropagation();lbStep(-1)}; $("lb-next").onclick=e=>{e.stopPropagation();lbStep(1)}; $("lb-x").onclick=closeLb; $("lb-x").focus();
}
function lbStep(d){stepMri(d); drawLb(); $("lb-next").focus()}
function openLb(i){mriCur=i; layoutMri(); lbFrom=document.activeElement; lbOpen=true; $("lb").hidden=false; document.body.style.overflow="hidden"; drawLb()}
function closeLb(){if(!lbOpen)return; lbOpen=false; $("lb").hidden=true; document.body.style.overflow=""; if(lbFrom&&lbFrom.focus)lbFrom.focus()}
$("lb").addEventListener("click",e=>{if(!e.target.closest("figure"))closeLb()});
document.addEventListener("keydown",e=>{if(!lbOpen)return; if(e.key==="Escape")closeLb(); else if(e.key==="ArrowRight")lbStep(1); else if(e.key==="ArrowLeft")lbStep(-1)});
/* ---------------- flip tiles ---------------- */
function flipTile(t){const on=t.classList.toggle("flip");t.setAttribute("aria-pressed",on?"true":"false")}
$("marks").addEventListener("click",e=>{const t=e.target.closest(".tile");if(t)flipTile(t)});
$("marks").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=e.target.closest(".tile");if(t){e.preventDefault();flipTile(t)}});
/* ---------------- card pile ---------------- */
function layoutDeck(){const d=document.getElementById("deck");if(!d)return;const n=+d.dataset.n,cur=+d.dataset.cur;d.querySelectorAll(".dk").forEach(el=>{el.dataset.r=(+el.dataset.i-cur+n)%n})}
function nextCard(){const d=document.getElementById("deck");if(!d)return;d.dataset.cur=(+d.dataset.cur+1)%(+d.dataset.n);layoutDeck()}
$("marks").addEventListener("click",e=>{if(e.target.closest(".deck"))nextCard()});
$("marks").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;if(e.target.closest(".deck")){e.preventDefault();nextCard()}});
/* ---------------- copy ---------------- */
async function copyText(t,msg){ try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()} $("copy-st").textContent=msg; $("copy-st").className="st ok"; setTimeout(()=>{$("copy-st").textContent=""},3000); }
$("copy-sum").onclick=()=>copyText(briefText(Reference.evaluate(current.values)),"Summary copied.");
$("copy-tbl").onclick=()=>{const E=Reference.evaluate(current.values); const lines=[["Marker","Unit","Control","ALS","Case","Placement"].join("\t")]; for(const r of E.sections.flatMap(s=>s.rows))lines.push([r.name,r.unit,r.control.text||"",r.als.text||"",caseText(r),r.value==null?"Not measured":r.placed.label].join("\t")); copyText(lines.join("\n"),"Results table copied (tab-separated, paste into a spreadsheet).")};
/* ---------------- add results ---------------- */
let found={};
function showFound(values,skipped,notes){
  found={...values}; const ks=Object.keys(found), fs=Measures.fromSession(PATIENT,found,{}), bad=new Set(fs.errors.map(e=>e.split(":")[0]));
  $("rev").classList.toggle("on",ks.length>0||skipped.length>0);
  $("rev-t").innerHTML=ks.length?ks.map(k=>`<tr><td>${esc(lab(k))}</td><td><input type="number" step="any" data-k="${k}" value="${found[k]}"></td><td class="mute">${esc(M()[k].unit)}</td><td style="color:var(--bad);font-size:12px">${bad.has(k)?"outside plausible range":""}</td><td><button class="x" data-r="${k}" aria-label="Remove">&#10005;</button></td></tr>`).join(""):`<tr><td class="mute">No known markers found.</td></tr>`;
  $("rev-t").querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{found[i.dataset.k]=Number(i.value);showFound(found,skipped,notes)});
  $("rev-t").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{delete found[b.dataset.r];showFound(found,skipped,notes)});
  $("rev-skip").textContent=[skipped.length?"Not recognised, so ignored: "+skipped.slice(0,12).join(", ")+(skipped.length>12?"...":""):"",...(notes||[])].filter(Boolean).join(" · ");
  $("rev-save").disabled=!ks.length||bad.size>0;
}
const st=(t,c)=>{$("up-st").textContent=t;$("up-st").className="st "+(c||"")};
async function handleFile(f){
  if(!f)return; if(f.size>4*1024*1024){st("That file is over 4 MB.","bad");return}
  st("Reading "+f.name+"...");
  try{
    if(/^(image\/(png|jpeg|webp)|application\/pdf)$/.test(f.type)){
      const buf=new Uint8Array(await f.arrayBuffer());let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
      const r=await fetch("/api/extract-labs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mime:f.type,data:btoa(bin)})}),j=await r.json().catch(()=>({}));
      if(!r.ok){st(j.error||"Could not read that file ("+r.status+")","bad");return}
      showFound(j.values,j.unmatched||[],j.rejected||[]); const n=Object.keys(j.values).length; st(n?`Found ${n} value${n>1?"s":""} with Gemini. Check them before saving.`:"No known markers found in that document.",n?"ok":"bad");
    }else{
      const res=LabFile.parse(await f.text(),f.name); showFound(res.values,res.skipped,res.notes); const n=Object.keys(res.values).length;
      st(n?`Found ${n} value${n>1?"s":""}. Check them before saving.`:"No known markers found in that file.",n?"ok":"bad");
    }
  }catch(e){st("Could not read that file: "+(e.message||e),"bad")}
}
const drop=$("drop");
$("file").onchange=e=>{handleFile(e.target.files[0]);e.target.value=""};
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>handleFile(e.dataTransfer.files[0]));
$("rev-cancel").onclick=()=>{$("rev").classList.remove("on");found={};st("")};
$("rev-save").onclick=async()=>{
  const n=Object.keys(found).length; if(!n)return; st("Saving...");
  try{ await Companion.save(PATIENT,found,{source:"lab"}); render(await getValues()); st(`Updated ${n} value${n>1?"s":""}. The report is current.`,"ok"); }
  catch(e){
    if(e.status){st("Could not save: "+e.message,"bad");return}
    current.values={...current.values,...found}; render(current); st(`Server not running, so ${n} value${n>1?"s were":" was"} applied to this view only and not saved.`,"bad");
  }
  $("rev").classList.remove("on"); found={};
};
getValues().then(render);
</script>
